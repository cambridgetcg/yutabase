      - name: Serialize card deletion with logical registry renames
        run: |
          gate_log="${RUNNER_TEMP}/rename-race-gate.log"
          delete_log="${RUNNER_TEMP}/rename-race-delete.log"
          rename_log="${RUNNER_TEMP}/rename-race-rename.log"
          thread_log="${RUNNER_TEMP}/rename-race-thread.log"

          psql "$FRESH_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA rename_race;
          CREATE TABLE rename_race.cards (
            id uuid PRIMARY KEY,
            at timestamptz NOT NULL,
            by text NOT NULL,
            how text NOT NULL,
            src text[]
          );
          INSERT INTO rename_race.cards VALUES (
            '0197a1f4-0000-7000-8000-00000000b001',
            clock_timestamp(),
            'system:ci',
            'declared',
            NULL
          );
          INSERT INTO yu.registry (
            book, deck, physical_schema, physical_table,
            native, by
          ) VALUES (
            'rename_race', 'a', 'rename_race', 'cards',
