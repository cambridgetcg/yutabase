          PGAPPNAME=rename-race-gate psql "$FRESH_URL" \
            -v ON_ERROR_STOP=1 \
            -c 'SELECT pg_advisory_lock(5007); SELECT pg_sleep(60)' \
            >"$gate_log" 2>&1 &
          gate_pid=$!

          gate_ready=f
          for attempt in {1..200}; do
            gate_ready="$(psql "$FRESH_URL" -At -v ON_ERROR_STOP=1 -c \
              "SELECT EXISTS (
                 SELECT 1
                 FROM pg_catalog.pg_locks lock
                 JOIN pg_catalog.pg_stat_activity activity
                   ON activity.pid = lock.pid
                 WHERE activity.application_name = 'rename-race-gate'
                   AND lock.locktype = 'advisory'
                   AND lock.granted
               )")"
            if [ "$gate_ready" = 't' ]; then
              break
            fi
            sleep 0.05
          done
          if [ "$gate_ready" != 't' ]; then
            wait "$gate_pid" || true
            echo 'logical-rename race gate never acquired its lock' >&2
            exit 1
          fi

          PGAPPNAME=rename-race-delete psql "$FRESH_URL" \
            -v ON_ERROR_STOP=1 >"$delete_log" 2>&1 <<'SQL' &
          BEGIN;
          DELETE FROM rename_race.cards
          WHERE id = '0197a1f4-0000-7000-8000-00000000b001';
          SELECT pg_advisory_xact_lock(5007);
          COMMIT;
          SQL
          delete_pid=$!

          delete_ready=f
          for attempt in {1..200}; do
            delete_ready="$(psql "$FRESH_URL" -At -v ON_ERROR_STOP=1 -c \
              "SELECT EXISTS (
                 SELECT 1
                 FROM pg_catalog.pg_locks lock
                 JOIN pg_catalog.pg_stat_activity activity
                   ON activity.pid = lock.pid
                 WHERE activity.application_name = 'rename-race-delete'
                   AND lock.relation = 'rename_race.cards'::regclass
                   AND lock.mode = 'RowExclusiveLock'
                   AND lock.granted
               )")"
            if [ "$delete_ready" = 't' ]; then
              break
            fi
            sleep 0.05
          done
          if [ "$delete_ready" != 't' ]; then
            psql "$FRESH_URL" -Atqc \
              "SELECT pg_terminate_backend(pid)
               FROM pg_catalog.pg_stat_activity
               WHERE application_name IN (
                 'rename-race-gate',
                 'rename-race-delete'
               )" >/dev/null
            wait "$gate_pid" || true
            wait "$delete_pid" || true
            echo 'card deletion never acquired its physical-table lock' >&2
            exit 1
          fi

          PGAPPNAME=rename-race-rename psql "$FRESH_URL" \
            -v ON_ERROR_STOP=1 >"$rename_log" 2>&1 <<'SQL' &
          UPDATE yu.registry
          SET deck = 'b',
              at = clock_timestamp(),
              by = 'system:ci'
          WHERE book = 'rename_race' AND deck = 'a';
          SQL
          rename_pid=$!

          rename_waiting=f
          for attempt in {1..200}; do
            rename_waiting="$(psql "$FRESH_URL" -At -v ON_ERROR_STOP=1 -c \
              "SELECT EXISTS (
                 SELECT 1
                 FROM pg_catalog.pg_locks lock
                 JOIN pg_catalog.pg_stat_activity activity
                   ON activity.pid = lock.pid
                 WHERE activity.application_name = 'rename-race-rename'
                   AND lock.relation = 'rename_race.cards'::regclass
                   AND lock.mode = 'ShareRowExclusiveLock'
                   AND NOT lock.granted
               )")"
            if [ "$rename_waiting" = 't' ]; then
              break
            fi
            sleep 0.05
          done
          if [ "$rename_waiting" != 't' ]; then
            psql "$FRESH_URL" -Atqc \
              "SELECT pg_terminate_backend(pid)
               FROM pg_catalog.pg_stat_activity
               WHERE application_name IN (
                 'rename-race-gate',
                 'rename-race-delete',
                 'rename-race-rename'
               )" >/dev/null
            wait "$gate_pid" || true
            wait "$delete_pid" || true
            wait "$rename_pid" || true
            echo 'logical registry rename bypassed the physical-table lock' >&2
            exit 1
          fi

          psql "$FRESH_URL" -Atqc \
            "SELECT pg_terminate_backend(pid)
             FROM pg_catalog.pg_stat_activity
             WHERE application_name = 'rename-race-gate'" >/dev/null
          wait "$gate_pid" || true

          set +e
          wait "$delete_pid"
          delete_status=$?
          wait "$rename_pid"
          rename_status=$?
          PGAPPNAME=rename-race-thread psql "$FRESH_URL" \
            -v ON_ERROR_STOP=1 >"$thread_log" 2>&1 <<'SQL'
          INSERT INTO yu.threads (
            id, word,
            from_book, from_deck, from_id,
            to_book, to_deck, to_id,
            at, by, how
          ) VALUES (
            '019a0000-0000-7000-8000-00000000b001',
            'acted_for',
            'rename_race', 'b',
            '0197a1f4-0000-7000-8000-00000000b001',
            'rename_race', 'b',
            '0197a1f4-0000-7000-8000-00000000b001',
            clock_timestamp(),
            'system:ci',
            'declared'
          );
          SQL
          thread_status=$?
          set -e

          if [ "$delete_status" -ne 0 ] \
             || [ "$rename_status" -ne 0 ] \
             || [ "$thread_status" -eq 0 ]; then
            cat "$delete_log" "$rename_log" "$thread_log" >&2
            echo "logical-rename race statuses delete=$delete_status rename=$rename_status thread=$thread_status" >&2
            exit 1
          fi
          if ! grep -q 'MISSING CARD' "$thread_log"; then
            cat "$thread_log" >&2
            echo 'logical-rename race failed for an unexpected reason' >&2
            exit 1
          fi

          rename_state="$(psql "$FRESH_URL" -At -v ON_ERROR_STOP=1 -c \
            "SELECT
               NOT EXISTS (
                 SELECT 1 FROM rename_race.cards
                 WHERE id = '0197a1f4-0000-7000-8000-00000000b001'
               ),
               EXISTS (
                 SELECT 1 FROM yu.registry
                 WHERE book = 'rename_race' AND deck = 'b'
               ),
               NOT EXISTS (
                 SELECT 1 FROM yu.threads
                 WHERE id = '019a0000-0000-7000-8000-00000000b001'
               )")"
          if [ "$rename_state" != 't|t|t' ]; then
            echo "logical-rename race left inconsistent state: $rename_state" >&2
            exit 1
          fi

          psql "$FRESH_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DELETE FROM yu.registry
          WHERE book = 'rename_race' AND deck = 'b';
          DROP SCHEMA rename_race CASCADE;
          SQL

