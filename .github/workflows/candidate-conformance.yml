      - name: Upgrade exact revision 4 under a different operator
        run: |
          psql "$REV4_URL" --single-transaction -v ON_ERROR_STOP=1 \
            -f sql/0005_candidate_integrity.sql
          psql "$REV4_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE yutabase_rev4_owner;
          SELECT yu._source_locators_valid(ARRAY['old-owner/source']);
          SELECT *
          FROM yu._lock_registry_mapping('revfour', 'from_cards');
          UPDATE yu.lexicon
          SET src = src
          WHERE word = 'acted_for';
          RESET ROLE;

          DO $assert$
          BEGIN
            IF NOT EXISTS (
              SELECT 1
              FROM yu.standard_meta
              WHERE standard = 'YUTABASE'
                AND profile = 'postgres'
                AND version = '0.1.0-candidate.1'
                AND revision = 5
                AND capabilities @> ARRAY[
                  'guarded-card-identity',
                  'nonblank-source-locators'
                ]::text[]
            ) OR NOT EXISTS (
              SELECT 1
              FROM yu.threads
              WHERE id = '019a0000-0000-7000-8000-00000000f401'
                AND word_version = 1
            ) OR (
              SELECT count(*)
              FROM pg_catalog.pg_trigger t
              WHERE t.tgrelid IN (
                'revfour.from_cards'::regclass,
                'revfour.to_cards'::regclass
              )
                AND (
                  (
                    t.tgname = 'yutabase_guard_delete'
                    AND t.tgtype = 25
                    AND t.tgfoid = 'yu._guard_delete()'::regprocedure
                    AND cardinality(t.tgattr::smallint[]) = 0
                  )
                  OR (
                    t.tgname = 'yutabase_guard_truncate'
                    AND t.tgtype = 32
                    AND t.tgfoid = 'yu._guard_truncate()'::regprocedure
                  )
                )
            ) <> 4 OR EXISTS (
              SELECT 1
              FROM pg_catalog.pg_proc p
              JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'yu'
                AND pg_catalog.pg_get_userbyid(p.proowner) <> current_user
            ) OR EXISTS (
              SELECT 1
              FROM pg_catalog.pg_class c
              JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'via'
                AND c.relkind = 'v'
                AND pg_catalog.pg_get_userbyid(c.relowner) <> current_user
            ) OR (
              SELECT count(*)
              FROM pg_catalog.pg_constraint
              WHERE (conrelid, conname) IN (
                ('yu.lexicon'::regclass, 'lexicon_src_locators_valid'),
                ('yu.word_versions'::regclass, 'word_versions_src_locators_valid'),
                ('yu.threads'::regclass, 'threads_src_locators_valid'),
                ('yu.sever_log'::regclass, 'sever_log_src_locators_valid'),
                ('yu.sever_log'::regclass, 'sever_log_thread_src_locators_valid')
              )
                AND convalidated
            ) <> 5 OR NOT EXISTS (
              SELECT 1
              FROM pg_catalog.pg_constraint
              WHERE conrelid = 'yu.registry'::regclass
                AND conname = 'registry_mapped_columns_distinct'
                AND contype = 'c'
                AND convalidated
            ) OR (
              SELECT count(*)
              FROM pg_catalog.pg_constraint
              WHERE (conrelid, conname) IN (
                ('yu.lexicon_versions'::regclass, 'lexicon_versions_gloss_nonempty'),
                ('yu.lexicon_versions'::regclass, 'lexicon_versions_inverse_nonempty'),
                ('yu.lexicon_versions'::regclass, 'lexicon_versions_claimant_nonempty')
              )
                AND contype = 'c'
                AND convalidated
            ) <> 3 OR NOT EXISTS (
              SELECT 1
              FROM pg_catalog.pg_proc p
              CROSS JOIN LATERAL pg_catalog.aclexplode(
                coalesce(p.proacl, pg_catalog.acldefault('f', p.proowner))
              ) acl
              WHERE p.oid = 'yu._nonblank_text(text)'::regprocedure
                AND acl.grantee = 0
                AND acl.privilege_type = 'EXECUTE'
                AND NOT acl.is_grantable
            ) OR NOT EXISTS (
              SELECT 1
              FROM pg_catalog.pg_proc p
              CROSS JOIN LATERAL pg_catalog.aclexplode(
                coalesce(p.proacl, pg_catalog.acldefault('f', p.proowner))
              ) acl
              WHERE p.oid =
                    'yu._source_locators_valid(text[])'::regprocedure
                AND acl.grantee = 0
                AND acl.privilege_type = 'EXECUTE'
                AND NOT acl.is_grantable
            ) OR NOT EXISTS (
              SELECT 1
              FROM pg_catalog.pg_proc p
              CROSS JOIN LATERAL pg_catalog.aclexplode(
                coalesce(p.proacl, pg_catalog.acldefault('f', p.proowner))
              ) acl
              WHERE p.oid =
                    'yu._lock_registry_mapping(text,text)'::regprocedure
                AND acl.grantee = to_regrole('yu_reader')
                AND acl.privilege_type = 'EXECUTE'
                AND NOT acl.is_grantable
            ) THEN
              RAISE EXCEPTION 'exact revision-4 preservation upgrade is incomplete';
            END IF;
          END
          $assert$;
          SQL

