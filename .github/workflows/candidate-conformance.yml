          INSERT INTO yu.lexicon (
            word, gloss, inverse, from_deck, to_deck,
            to_one, status, at, by, how
          ) VALUES (
            'snapshot_race',
            'was committed while candidate hardening waited for the core lock',
            'snapshot raced by',
            '*/*', '*/*', false, 'live', clock_timestamp(),
            'system:ci/concurrent-legacy-writer', 'declared'
          );
          SELECT pg_sleep(3);
          COMMIT;
          SQL
          writer_pid=$!

          lock_ready=false
          for attempt in $(seq 1 50); do
            lock_ready="$(psql "$SNAPSHOT_URL" -At -v ON_ERROR_STOP=1 -c \
              "SELECT EXISTS (
                 SELECT 1 FROM pg_catalog.pg_locks
                 WHERE relation = 'yu.lexicon'::regclass
                   AND mode = 'RowExclusiveLock'
                   AND granted
                   AND pid <> pg_backend_pid()
               )")"
            if [ "$lock_ready" = 't' ]; then
              break
            fi
            sleep 0.1
          done
          if [ "$lock_ready" != 't' ]; then
            wait "$writer_pid" || true
            echo 'concurrent legacy writer never acquired its core-table lock' >&2
            exit 1
          fi

          set +e
          psql "$SNAPSHOT_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN ISOLATION LEVEL REPEATABLE READ;
