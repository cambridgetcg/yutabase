          capability_owner_preserved="$(
            psql "$capability_owner_url" -At -v ON_ERROR_STOP=1 -c \
              "SELECT relowner = to_regrole('yu_writer')
               FROM pg_catalog.pg_class
               WHERE oid = 'yu.thread_ids'::regclass"
          )"
          if [ "$capability_owner_preserved" != 't' ]; then
            echo 'capability ownership drift was not retained' >&2
            exit 1
          fi

          assert_semantic_refusal "$duplicate_acl_url" \
