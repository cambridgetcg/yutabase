          BEGIN ISOLATION LEVEL REPEATABLE READ;
          SELECT count(*) FROM yu.lexicon;
          \i sql/0004_candidate_hardening.sql
          COMMIT;
          SQL
          )"
          stale_snapshot_status=$?
