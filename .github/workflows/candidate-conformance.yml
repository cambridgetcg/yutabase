            GRANT EXECUTE ON FUNCTIONS TO yutabase_default_acl_probe;
          SQL
          psql "$default_acl_url" --single-transaction \
            -v ON_ERROR_STOP=1 -f sql/0005_candidate_integrity.sql
          default_acl_state="$(psql "$default_acl_url" -At \
            -v ON_ERROR_STOP=1 -c \
            "SELECT
               (SELECT revision = 5
                FROM yu.standard_meta WHERE singleton),
               NOT EXISTS (
                 SELECT 1
                 FROM pg_catalog.pg_proc routine
                 JOIN pg_catalog.pg_namespace namespace_row
                   ON namespace_row.oid = routine.pronamespace
                 CROSS JOIN LATERAL pg_catalog.aclexplode(
