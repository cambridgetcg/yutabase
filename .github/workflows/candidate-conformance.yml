          if [ "$stale_snapshot_status" -eq 0 ]; then
            echo 'candidate migration accepted a pre-established repeatable-read snapshot' >&2
            exit 1
          fi
          if ! printf '%s\n' "$stale_snapshot_output" | grep -q 'SET TRANSACTION'; then
            printf '%s\n' "$stale_snapshot_output" >&2
            echo 'stale-snapshot refusal failed for an unexpected reason' >&2
            exit 1
