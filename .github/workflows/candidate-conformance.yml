          if [ "$operator_tuning_state" != 't|t' ]; then
            echo "operator tuning did not survive upgrade: $operator_tuning_state" >&2
            exit 1
          fi

          psql "$default_acl_url" -v ON_ERROR_STOP=1 <<'SQL'
