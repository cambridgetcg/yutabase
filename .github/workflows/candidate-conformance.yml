               JOIN pg_catalog.pg_sequence sequence_definition
                 ON sequence_definition.seqrelid =
                    'yu.lexicon_versions_version_id_seq'::regclass"
          )"
          if [ "$sequence_last_value_state" != 't|t|t' ]; then
            echo "final usable identity value was not preserved: $sequence_last_value_state" >&2
            exit 1
          fi
          final_generated_value="$(
            psql "$sequence_last_value_url" -At -v ON_ERROR_STOP=1 -c \
              "SELECT nextval(
                 'yu.lexicon_versions_version_id_seq'
               )::numeric = (
                 SELECT seqmax::numeric
                 FROM pg_catalog.pg_sequence
                 WHERE seqrelid =
                   'yu.lexicon_versions_version_id_seq'::regclass
               )"
          )"
          if [ "$final_generated_value" != 't' ]; then
            echo 'identity sequence did not emit its final usable value' >&2
            exit 1
          fi

      - name: Close the revision-4 guard-installation race
        run: |
          race_url='postgresql://postgres:postgres@localhost:5432/yutabase_rev4_race'
          gate_log="${RUNNER_TEMP}/rev5-race-gate.log"
          card_log="${RUNNER_TEMP}/rev5-race-card.log"
          migration_log="${RUNNER_TEMP}/rev5-race-migration.log"

          PGAPPNAME=rev5-race-gate psql "$race_url" \
            -v ON_ERROR_STOP=1 \
            -c 'SELECT pg_advisory_lock(5005); SELECT pg_sleep(60)' \
            >"$gate_log" 2>&1 &
          gate_pid=$!

          gate_ready=f
          for attempt in {1..200}; do
            gate_ready="$(psql "$race_url" -At -v ON_ERROR_STOP=1 -c \
              "SELECT EXISTS (
                 SELECT 1
                 FROM pg_catalog.pg_locks lock
                 JOIN pg_catalog.pg_stat_activity activity
                   ON activity.pid = lock.pid
                 WHERE activity.application_name = 'rev5-race-gate'
                   AND lock.locktype = 'advisory'
                   AND lock.granted
               )")"
            if [ "$gate_ready" = 't' ]; then
              break
            fi
            sleep 0.05
          done
          if [ "$gate_ready" != 't' ]; then
            wait "$gate_pid" || true
            echo 'revision-5 race gate never acquired its advisory lock' >&2
            exit 1
          fi

          PGAPPNAME=rev5-race-card psql "$race_url" \
            -v ON_ERROR_STOP=1 >"$card_log" 2>&1 <<'SQL' &
          BEGIN;
          LOCK TABLE revfour.from_cards IN ROW EXCLUSIVE MODE;
          SELECT pg_advisory_xact_lock(5005);
          DELETE FROM revfour.from_cards
          WHERE id = '0197a1f4-0000-7000-8000-00000000f401';
          COMMIT;
          SQL
          card_pid=$!

          card_ready=f
          for attempt in {1..200}; do
            card_ready="$(psql "$race_url" -At -v ON_ERROR_STOP=1 -c \
              "SELECT EXISTS (
                 SELECT 1
                 FROM pg_catalog.pg_locks lock
                 JOIN pg_catalog.pg_stat_activity activity
                   ON activity.pid = lock.pid
                 WHERE activity.application_name = 'rev5-race-card'
                   AND lock.relation = 'revfour.from_cards'::regclass
                   AND lock.mode = 'RowExclusiveLock'
                   AND lock.granted
               )")"
            if [ "$card_ready" = 't' ]; then
              break
            fi
            sleep 0.05
          done
          if [ "$card_ready" != 't' ]; then
            psql "$race_url" -Atqc \
              "SELECT pg_terminate_backend(pid)
               FROM pg_catalog.pg_stat_activity
               WHERE application_name IN ('rev5-race-gate','rev5-race-card')" \
              >/dev/null
            wait "$gate_pid" || true
            wait "$card_pid" || true
            echo 'revision-4 card writer never acquired its table lock' >&2
            exit 1
          fi

          PGAPPNAME=rev5-race-migration psql "$race_url" \
            --single-transaction -v ON_ERROR_STOP=1 \
            -f sql/0005_candidate_integrity.sql \
            >"$migration_log" 2>&1 &
          migration_pid=$!

          migration_waiting=f
          for attempt in {1..200}; do
            migration_waiting="$(psql "$race_url" -At -v ON_ERROR_STOP=1 -c \
              "SELECT EXISTS (
                 SELECT 1
                 FROM pg_catalog.pg_locks lock
                 JOIN pg_catalog.pg_stat_activity activity
                   ON activity.pid = lock.pid
                 WHERE activity.application_name = 'rev5-race-migration'
                   AND lock.relation = 'revfour.from_cards'::regclass
                   AND lock.mode = 'ShareRowExclusiveLock'
                   AND NOT lock.granted
               )")"
            if [ "$migration_waiting" = 't' ]; then
              break
            fi
            sleep 0.05
          done
          if [ "$migration_waiting" != 't' ]; then
            psql "$race_url" -Atqc \
              "SELECT pg_terminate_backend(pid)
               FROM pg_catalog.pg_stat_activity
               WHERE application_name IN (
                 'rev5-race-gate','rev5-race-card',
                 'rev5-race-migration'
               )" >/dev/null
            wait "$gate_pid" || true
            wait "$card_pid" || true
            wait "$migration_pid" || true
            echo 'revision-5 migration never reached physical guard reconciliation' >&2
            exit 1
          fi

          psql "$race_url" -Atqc \
            "SELECT pg_terminate_backend(pid)
             FROM pg_catalog.pg_stat_activity
             WHERE application_name = 'rev5-race-gate'" >/dev/null
          wait "$gate_pid" || true

          set +e
          wait "$card_pid"
          card_status=$?
          wait "$migration_pid"
          migration_status=$?
          set -e
          if [ "$card_status" -ne 0 ] || [ "$migration_status" -eq 0 ]; then
            cat "$card_log" "$migration_log" >&2
            echo "guard-installation race statuses were card=$card_status migration=$migration_status" >&2
            exit 1
          fi

          race_state="$(psql "$race_url" -At -v ON_ERROR_STOP=1 -c \
            "SELECT revision,
                    to_regprocedure('yu._source_locators_valid(text[])') IS NULL,
                    EXISTS (
                      SELECT 1 FROM revfour.from_cards
                      WHERE id = '0197a1f4-0000-7000-8000-00000000f401'
                    ),
                    NOT EXISTS (
                      SELECT 1
                      FROM pg_catalog.pg_trigger
                      WHERE tgrelid = 'revfour.from_cards'::regclass
                        AND tgname IN (
                          'yutabase_guard_delete',
                          'yutabase_guard_truncate'
                        )
                    )
             FROM yu.standard_meta WHERE singleton")"
          if [ "$race_state" != '4|t|f|t' ]; then
            echo "guard-installation race was not atomic: $race_state" >&2
            exit 1
          fi

