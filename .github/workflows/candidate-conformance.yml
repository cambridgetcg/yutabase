          duplicate_acl_preserved="$(
            psql "$duplicate_acl_url" -At -v ON_ERROR_STOP=1 -c \
              "SELECT count(*) = 2
               FROM pg_catalog.pg_class relation
               CROSS JOIN LATERAL pg_catalog.aclexplode(
                 relation.relacl
               ) acl
               WHERE relation.oid = 'yu.threads'::regclass
                 AND acl.grantee = to_regrole('yu_reader')
                 AND acl.privilege_type = 'SELECT'
                 AND NOT acl.is_grantable"
