          DROP ROLE yutabase_default_acl_probe;
          SQL

          psql "$sequence_last_value_url" --single-transaction \
            -v ON_ERROR_STOP=1 -f sql/0005_candidate_integrity.sql
          sequence_last_value_state="$(
            psql "$sequence_last_value_url" -At -v ON_ERROR_STOP=1 -c \
