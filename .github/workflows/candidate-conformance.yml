              -v ON_ERROR_STOP=1 -c \
              "SELECT revision,
                      to_regprocedure(
                        'yu._source_locators_valid(text[])'
                      ) IS NULL
               FROM yu.standard_meta WHERE singleton")"
            if [ "$semantic_state" != '4|t' ]; then
              echo "$semantic_label refusal was not atomic: $semantic_state" >&2
              exit 1
