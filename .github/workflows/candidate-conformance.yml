            -v ON_ERROR_STOP=1 -c \
            "SELECT EXISTS (
               SELECT 1
               FROM yu.sever_log history
               JOIN yu.word_versions word
                 ON word.word = history.word
                AND word.word_version = history.word_version
               WHERE NOT yu._deck_matches(
                       word.from_deck,
                       history.from_book,
                       history.from_deck
                     )
             )")"
          if [ "$sever_endpoint_preserved" != 't' ]; then
            echo 'sever-endpoint-pattern drift was not retained' >&2
            exit 1
          fi

          assert_semantic_refusal "$sever_claim_url" 'partial-sever-claim'
          sever_claim_preserved="$(psql "$sever_claim_url" -At \
            -v ON_ERROR_STOP=1 -c \
            "SELECT EXISTS (
               SELECT 1 FROM yu.sever_log
               WHERE thread_at IS NOT NULL
                 AND thread_by IS NULL
                 AND thread_how IS NOT NULL
             )")"
          if [ "$sever_claim_preserved" != 't' ]; then
            echo 'partial-sever-claim drift was not retained' >&2
            exit 1
          fi

          assert_semantic_refusal "$sever_label_url" 'invalid-sever-label'
          sever_label_preserved="$(psql "$sever_label_url" -At \
            -v ON_ERROR_STOP=1 -c \
            "SELECT EXISTS (
               SELECT 1 FROM yu.sever_log
               WHERE from_book !~ '^[a-z_][a-z0-9_]*$'
