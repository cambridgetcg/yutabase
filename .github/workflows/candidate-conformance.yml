            -v ON_ERROR_STOP=1 -c \
            "SELECT
               (SELECT current_version = 2 FROM yu.lexicon
                WHERE word = 'contains'),
               NOT EXISTS (
                 SELECT 1 FROM yu.word_versions
                 WHERE word = 'contains' AND word_version = 1
               ),
               EXISTS (
                 SELECT 1 FROM yu.word_versions
                 WHERE word = 'contains' AND word_version = 2
               )")"
          if [ "$snapshot_gap_preserved" != 't|t|t' ]; then
            echo "word-snapshot-gap drift was not retained: $snapshot_gap_preserved" >&2
            exit 1
