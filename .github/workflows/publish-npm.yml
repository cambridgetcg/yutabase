name: Publish exact YUTABASE npm mirror

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated candidate tag contained in main
        required: true
        default: v0.1.0-candidate.3
        type: string

permissions: {}

concurrency:
  group: publish-yutabase-npm
  cancel-in-progress: false

jobs:
  prepare:
    name: Build and verify exact GitHub Release artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out release control plane from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate annotated tag and main ancestry
        id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Dispatch this workflow from main, not $GITHUB_REF" >&2
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^v0\.1\.0-candidate\.[0-9]+$ ]] || {
            echo "Unsupported candidate tag: $RELEASE_TAG" >&2
            exit 1
          }
          git fetch --force --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" == "tag" ]] || {
            echo "$RELEASE_TAG is not an annotated tag" >&2
            exit 1
          }
          commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor \
            "$commit" refs/remotes/origin/main || {
            echo "$RELEASE_TAG is not contained in origin/main" >&2
            exit 1
          }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out pinned historical release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun 1.3.5
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Pin release npm
        run: npm install --global --ignore-scripts npm@11.17.0

      - name: Validate, test, build, and pack without publish credentials
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          TAG_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          source_commit="$(git -C release-source rev-parse HEAD)"
          [[ "$source_commit" == "$TAG_COMMIT" ]]
          [[ -z "$(git -C release-source status --porcelain)" ]]

          manifest="release-source/packages/sdk-ts/package.json"
          version="$(jq -er '.version | strings' "$manifest")"
          [[ "$RELEASE_TAG" == "v${version}" ]]
          jq -e --arg version "$version" '
            .name == "yutabase"
            and .version == $version
            and ($version | test("^0\\.1\\.0-candidate\\.[0-9]+$"))
            and .repository.url
              == "git+https://github.com/cambridgetcg/yutabase.git"
            and .publishConfig == {access: "public", tag: "next"}
            and (.private // false) == false
          ' "$manifest" >/dev/null

          cd release-source/packages/sdk-ts
          bun install --frozen-lockfile
          bun run ci
          out="${RUNNER_TEMP}/local-pack"
          mkdir -p "$out"
          npm pack . --ignore-scripts --pack-destination "$out" >/dev/null
          filename="yutabase-${version}.tgz"
          test -f "${out}/${filename}"
          {
            echo "version=$version"
            echo "filename=$filename"
          } >> "$GITHUB_OUTPUT"

      - name: Match the existing GitHub Release asset and make receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          TAG_COMMIT: ${{ steps.source.outputs.commit }}
          VERSION: ${{ steps.package.outputs.version }}
          FILENAME: ${{ steps.package.outputs.filename }}
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/github-release"
          transfer_dir="${RUNNER_TEMP}/npm-release"
          mkdir -p "$release_dir" "$transfer_dir"

          release="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets)"
          jq -e --arg tag "$RELEASE_TAG" --arg file "$FILENAME" '
            .tagName == $tag
            and .isDraft == false
            and .isPrerelease == true
            and ([.assets[] | select(.name == $file)] | length) == 1
          ' <<<"$release" >/dev/null
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$FILENAME" \
            --dir "$release_dir"

          local_file="${RUNNER_TEMP}/local-pack/${FILENAME}"
          release_file="${release_dir}/${FILENAME}"
          cmp --silent "$local_file" "$release_file" || {
            echo "Built package differs from the GitHub Release asset" >&2
            exit 1
          }
          cp "$release_file" "${transfer_dir}/${FILENAME}"
          bytes="$(stat --format=%s "$release_file")"
          sha256="$(sha256sum "$release_file" | cut -d' ' -f1)"
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$TAG_COMMIT" \
            --arg version "$VERSION" \
            --arg file "$FILENAME" \
            --argjson bytes "$bytes" \
            --arg sha256 "$sha256" \
            '{
              schema: "yutabase.npm-release/1",
              repository: "cambridgetcg/yutabase",
              tag: $tag,
              commit: $commit,
              package: "yutabase",
              version: $version,
              npm_tag: "next",
              artifact: {
                file: $file,
                bytes: $bytes,
                sha256: $sha256
              }
            }' > "${transfer_dir}/receipt.json"
          test "$(stat --format=%s "${transfer_dir}/receipt.json")" -le 2048
          test "$(find "$transfer_dir" -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Transfer only the exact package and bounded receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: yutabase-npm-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/npm-release/${{ steps.package.outputs.filename }}
            ${{ runner.temp }}/npm-release/receipt.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Approve, publish with OIDC, and verify public bytes
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-bootstrap
    permissions:
      id-token: write
    steps:
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin release npm
        run: npm install --global --ignore-scripts npm@11.17.0

      - name: Download prepared package without running package code
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: yutabase-npm-release-${{ github.run_id }}
          path: ${{ runner.temp }}/npm-release

      - name: Validate and publish exact artifact through npm OIDC
        shell: bash
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/npm-release"
          receipt="${dir}/receipt.json"
          test -f "$receipt"
          test "$(stat --format=%s "$receipt")" -le 2048
          jq -e '
            keys == [
              "artifact", "commit", "npm_tag", "package", "repository",
              "schema", "tag", "version"
            ]
            and .schema == "yutabase.npm-release/1"
            and .repository == "cambridgetcg/yutabase"
            and .package == "yutabase"
            and .npm_tag == "next"
            and .tag == ("v" + .version)
            and (.version | test("^0\\.1\\.0-candidate\\.[0-9]+$"))
            and (.commit | test("^[0-9a-f]{40}$"))
            and (.artifact | keys == ["bytes", "file", "sha256"])
            and .artifact.file == ("yutabase-" + .version + ".tgz")
            and (.artifact.bytes | type == "number" and . > 0)
            and (.artifact.sha256 | test("^[0-9a-f]{64}$"))
          ' "$receipt" >/dev/null

          file="${dir}/$(jq -r '.artifact.file' "$receipt")"
          test -f "$file"
          test "$(stat --format=%s "$file")" \
            -eq "$(jq -r '.artifact.bytes' "$receipt")"
          test "$(sha256sum "$file" | cut -d' ' -f1)" \
            = "$(jq -r '.artifact.sha256' "$receipt")"
          test -z "${NPM_TOKEN:-}"

          observe_public_exact() {
            local label="$1"
            local metadata="${RUNNER_TEMP}/${label}-version.json"
            local package_metadata="${RUNNER_TEMP}/${label}-package.json"
            local registry_copy="${RUNNER_TEMP}/${label}.tgz"
            local status tarball_url dist_tag

            if ! status="$(curl --silent --show-error \
              --proto '=https' --tlsv1.2 \
              --output "$metadata" \
              --write-out '%{http_code}' \
              "https://registry.npmjs.org/yutabase/${version}")"
            then
              echo "Could not observe npm version metadata" >&2
              return 2
            fi
            if [[ "$status" == "404" ]]; then
              return 1
            fi
            if [[ "$status" != "200" ]]; then
              echo "Unexpected npm version status: $status" >&2
              return 2
            fi
            if ! jq -e --arg version "$version" '
              .name == "yutabase"
              and .version == $version
              and (.dist.tarball | test(
                "^https://registry\\.npmjs\\.org/yutabase/-/yutabase-[^/]+\\.tgz$"
              ))
            ' "$metadata" >/dev/null
            then
              echo "Public npm metadata does not match the receipt" >&2
              return 2
            fi

            tarball_url="$(jq -r '.dist.tarball' "$metadata")"
            if ! curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 \
              --output "$registry_copy" "$tarball_url"
            then
              echo "Could not download the public npm tarball" >&2
              return 2
            fi
            if [[ "$(stat --format=%s "$registry_copy")" \
              != "$(jq -r '.artifact.bytes' "$receipt")" ]] \
              || [[ "$(sha256sum "$registry_copy" | cut -d' ' -f1)" \
              != "$(jq -r '.artifact.sha256' "$receipt")" ]]
            then
              echo "Public npm bytes differ from the release receipt" >&2
              return 2
            fi

            if ! curl --fail --silent --show-error \
              --proto '=https' --tlsv1.2 \
              --output "$package_metadata" \
              https://registry.npmjs.org/yutabase
            then
              echo "Could not observe npm distribution tags" >&2
              return 2
            fi
            dist_tag="$(jq -r '."dist-tags".next // empty' "$package_metadata")"
            if [[ "$dist_tag" != "$version" ]]; then
              echo "npm next points to ${dist_tag:-nothing}, not $version" >&2
              return 2
            fi
            return 0
          }

          version="$(jq -r '.version' "$receipt")"
          set +e
          observe_public_exact "before-publish"
          observation=$?
          set -e
          case "$observation" in
            0)
              echo "Exact public npm bytes already exist; recovered without publishing."
              exit 0
              ;;
            1)
              ;;
            *)
              exit 1
              ;;
          esac

          set +e
          npm publish "$file" \
            --ignore-scripts \
            --access public \
            --tag next \
            --provenance
          publish_status=$?
          set -e
          if [[ "$publish_status" == "0" ]]; then
            exit 0
          fi

          echo "npm publish exited $publish_status; checking for an accepted publish." >&2
          for ((attempt = 1; attempt <= 12; attempt++)); do
            set +e
            observe_public_exact "uncertain-${attempt}"
            observation=$?
            set -e
            case "$observation" in
              0)
                echo "Recovered an accepted, byte-identical npm publish."
                exit 0
                ;;
              1)
                sleep 5
                ;;
              *)
                exit 1
                ;;
            esac
          done
          echo "npm publish failed and exact public bytes did not appear." >&2
          exit 1

      - name: Verify anonymous public registry bytes
        shell: bash
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/npm-release/receipt.json"
          version="$(jq -r '.version' "$receipt")"
          metadata="${RUNNER_TEMP}/registry-version.json"
          registry_copy="${RUNNER_TEMP}/registry.tgz"

          for ((attempt = 1; attempt <= 90; attempt++)); do
            status="$(curl --silent --show-error \
              --output "$metadata" \
              --write-out '%{http_code}' \
              "https://registry.npmjs.org/yutabase/${version}")"
            [[ "$status" == "200" ]] && break
            [[ "$status" == "404" ]] || {
              echo "Unexpected npm registry status: $status" >&2
              exit 1
            }
            sleep 5
          done
          [[ "${status:-}" == "200" ]] || {
            echo "Published version was not publicly visible in time" >&2
            exit 1
          }

          jq -e --arg version "$version" '
            .name == "yutabase"
            and .version == $version
            and (.dist.tarball | test(
              "^https://registry\\.npmjs\\.org/yutabase/-/yutabase-[^/]+\\.tgz$"
            ))
          ' "$metadata" >/dev/null
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --output "$registry_copy" \
            "$(jq -r '.dist.tarball' "$metadata")"
          test "$(stat --format=%s "$registry_copy")" \
            -eq "$(jq -r '.artifact.bytes' "$receipt")"
          test "$(sha256sum "$registry_copy" | cut -d' ' -f1)" \
            = "$(jq -r '.artifact.sha256' "$receipt")"

          dist_tag="$(curl --fail --silent --show-error \
            https://registry.npmjs.org/yutabase | jq -r '."dist-tags".next')"
          test "$dist_tag" = "$version"
          {
            echo "## npm release receipt"
            echo
            echo "- Package: \`yutabase@${version}\`"
            echo "- Distribution tag: \`next\`"
            echo "- SHA-256: \`$(jq -r '.artifact.sha256' "$receipt")\`"
            echo "- Registry bytes exactly match the GitHub Release asset."
          } >> "$GITHUB_STEP_SUMMARY"
